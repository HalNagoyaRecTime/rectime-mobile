version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # 2.11.0 以降は AGP 9.1 以上 と compileSdk 37 以上 を要求し、
      # AGP 8.13 / compileSdk 36 の現状では checkDebugAarMetadata が落ちる。
      - dependency-name: "org.jetbrains.androidx.lifecycle:*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      gradle-patch-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:20"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"
