name: Create PR to develop-v2

on:
  push:
    branches:
      - develop

concurrency:
  group: develop-v2-sync-pr
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update PR into develop-v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --base develop-v2 --head develop --state open --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            if ! output=$(gh pr create \
              --base develop-v2 \
              --head develop \
              --title "Sync: develop -> develop-v2" \
              --body "develop の更新を develop-v2 に反映するための自動生成PRです。" 2>&1); then
              if echo "$output" | grep -q "No commits between"; then
                echo "develop と develop-v2 の間に差分がないためPR作成をスキップします。"
              else
                echo "$output" >&2
                exit 1
              fi
            else
              echo "$output"
            fi
          else
            echo "develop -> develop-v2 の open な PR は既に存在するためスキップします。"
          fi
